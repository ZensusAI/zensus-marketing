<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Default fallback title for non-prerendered paths. Every routed URL is prerendered with a route-specific title, description, canonical, and OpenGraph/Twitter tags via react-helmet-async. Only page-agnostic tags live here. -->
    <title>Zensus · Your cash flow, mapped as far ahead as you need</title>
    <meta name="author" content="Zensus" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zensus" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@zensusai" />
    <meta name="twitter:creator" content="@zensusai" />

    <!-- Meta domain verification for the Zensus Inc. business portfolio in Meta Business Suite. Meta's instructions say verification fails if the tag is outside the head or loaded by JavaScript, so it has to be in the HTML as served. It lives in this template rather than in a page's Helmet block because it is page-agnostic, and from here it reaches every route's HTML whether or not that route was prerendered. -->
    <meta name="facebook-domain-verification" content="bvzq9nz3zmuyzvgo54ycrvapmvkv2i" />

    <!-- Geist is self-hosted (see the @font-face block in src/index.css). We
         preload only the sans variable file (the primary text + headline font)
         so the fallback->Geist swap is near-instant; Geist Mono loads on demand
         via @font-face. This replaces a render-blocking Google Fonts stylesheet
         plus two cross-origin preconnects that delayed first paint on slow
         connections. crossorigin is required: fonts are always fetched in CORS
         mode, so without it the preload would not match the @font-face request. -->
    <link rel="preload" href="/fonts/geist-latin-variable.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0a0c0f" />
    <meta name="msapplication-TileColor" content="#0a0c0f" />

    <!-- Structured Data (JSON-LD). Organization and WebSite graphs apply site-wide; SoftwareApplication describes the Zensus product with its public $199/month Offer so AI models can cite the price as structured fact. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "__SITE_URL__/about#ajin-sunny",
            "name": "Ajin Sunny",
            "jobTitle": "Founder & CEO",
            "url": "__SITE_URL__/about",
            "worksFor": { "@id": "__SITE_URL__/#organization" },
            "knowsAbout": [
              "Cash flow forecasting",
              "Cash flow planning",
              "SaaS finance",
              "Full-stack web development"
            ],
            "sameAs": [
              "https://ajinsunny.com",
              "https://www.linkedin.com/in/ajinsunny/"
            ]
          },
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "Zensus",
            "alternateName": ["Zensus Cash Flow Forecasting", "__SITE_HOST__", "__LEGACY_SITE_HOST__"],
            "url": "__SITE_URL__",
            "description": "Zensus is cash flow forecasting software for businesses with unpredictable revenue, a US company.",
            "foundingDate": "2025-08",
            "logo": {
              "@type": "ImageObject",
              "url": "__SITE_URL__/logo.png",
              "width": 192,
              "height": 192
            },
            "founder": { "@id": "__SITE_URL__/about#ajin-sunny" },
            "sameAs": [
              "https://x.com/zensusai",
              "https://www.linkedin.com/company/zensusai",
              "https://github.com/ZensusAI",
              "https://www.g2.com/products/zensus/reviews"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@zensus.app",
              "url": "__SITE_URL__/support",
              "availableLanguage": ["English"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__",
            "name": "Zensus",
            "alternateName": ["__SITE_HOST__", "__LEGACY_SITE_HOST__"],
            "description": "Cash flow forecasting for businesses with unpredictable revenue",
            "publisher": { "@id": "__SITE_URL__/#organization" },
            "inLanguage": "en-US"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "__SITE_URL__/#software",
            "name": "Zensus",
            "description": "Cash flow forecasting for businesses with unpredictable revenue. Connect your bank, QuickBooks, and HubSpot, see your cash flow in real time, and run multi-turn what-if scenarios on hiring, churn, and pricing.",
            "url": "__SITE_URL__",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Cash Flow Forecasting Software",
            "operatingSystem": "Web",
            "featureList": [
              "Subscription-aware cash flow projections that place annual and quarterly contracts on the exact day they hit the bank",
              "Cash flow agent for multi-turn what-if scenarios (hiring, churn, pricing, late payments)",
              "Real-time webhook sync from Plaid, QuickBooks, and HubSpot",
              "Threshold-based Slack alerts on a rolling 30-day cash projection",
              "Zero-cash date recalculated live",
              "Monthly-to-weekly-to-daily cash flow drill-down"
            ],
            "screenshot": "__SITE_URL__/og/home.png",
            "dateModified": "__SITE_MODIFIED__",
            "publisher": { "@id": "__SITE_URL__/#organization" },
            "offers": {
              "@type": "Offer",
              "name": "Zensus Pro",
              "price": "199",
              "priceCurrency": "USD",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "price": "199",
                "priceCurrency": "USD",
                "billingDuration": "P1M",
                "unitCode": "MON",
                "unitText": "month"
              },
              "url": "__SITE_URL__/pricing",
              "availability": "https://schema.org/InStock",
              "category": "subscription"
            }
          }
        ]
      }
    </script>

    <!-- Apollo website tracker, skipped during prerender (window.__PRERENDER__) so it is
         never baked into the static HTML, and deferred to idle for real visitors so it
         never competes with first paint / LCP. -->
    <script>function initApollo(){var n=Math.random().toString(36).substring(7),o=document.createElement("script");o.src="https://assets.apollo.io/micro/website-tracker/tracker.iife.js?nocache="+n,o.async=!0,o.defer=!0,o.onload=function(){window.trackingFunctions.onLoad({appId:"6a1e52e88793c0000ccaf45e"})},document.head.appendChild(o)}if(!window.__PRERENDER__){if("requestIdleCallback"in window){requestIdleCallback(initApollo,{timeout:5000})}else{window.addEventListener("load",function(){setTimeout(initApollo,2000)})}}</script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
