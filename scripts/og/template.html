<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Cream-first brand card: the site's cream canvas, ink type, and the
         homepage hero mesh across the lower half. Colors are the theme-cream
         tokens in src/index.css. */
      :root {
        --cream: #fef7e6;
        --ink: #1a2a28;
        --muted: #506864;
        --rule: #ebdcb8;
        --accent: #0e5c3a;
        --accent-plaid: #1a2a28;
        --accent-quickbooks: #1f7a14;
        --accent-hubspot: #c2482a;
        --accent-slack: #a8164a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--cream);
        color: var(--ink);
        font-family:
          "Geist", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--cream);
      }

      .mesh {
        position: absolute;
        left: -90px;
        top: 196px;
        width: 1380px;
        height: auto;
        opacity: 0.95;
        pointer-events: none;
      }

      /* Hairline guides that run off the card edges, plus crop marks at the
         corners of the frame they make. */
      .rule {
        position: absolute;
        background: var(--rule);
      }
      .rule.h {
        left: 0;
        right: 0;
        height: 1px;
      }
      .rule.v {
        top: 0;
        bottom: 0;
        width: 1px;
      }
      .crop {
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: var(--ink);
        border-style: solid;
        border-width: 0;
      }
      .crop.tl { left: 66px; top: 66px; border-left-width: 1.5px; border-top-width: 1.5px; }
      .crop.tr { right: 66px; top: 66px; border-right-width: 1.5px; border-top-width: 1.5px; }
      .crop.bl { left: 66px; bottom: 66px; border-left-width: 1.5px; border-bottom-width: 1.5px; }
      .crop.br { right: 66px; bottom: 66px; border-right-width: 1.5px; border-bottom-width: 1.5px; }

      .content {
        position: absolute;
        left: 114px;
        top: 114px;
        right: 114px;
        bottom: 104px;
        display: flex;
        flex-direction: column;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .wordmark img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: block;
      }
      .wordmark span {
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .host {
        font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 17px;
        font-weight: 500;
        color: var(--muted);
      }

      .body {
        margin-top: 44px;
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 18px;
      }
      .eyebrow[data-empty="true"] {
        display: none;
      }

      .title {
        font-size: 76px;
        line-height: 1.02;
        font-weight: 600;
        letter-spacing: -0.035em;
        color: var(--ink);
        max-width: 930px;
        text-wrap: balance;
      }

      .subtitle {
        margin-top: 24px;
        font-size: 25px;
        line-height: 1.42;
        font-weight: 400;
        color: var(--muted);
        max-width: 800px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        /* A cream halo keeps the subtitle legible where it crosses the mesh. */
        text-shadow:
          0 0 6px var(--cream),
          0 0 12px var(--cream);
      }

      [data-accent="plaid"] { --accent: var(--accent-plaid); }
      [data-accent="quickbooks"] { --accent: var(--accent-quickbooks); }
      [data-accent="hubspot"] { --accent: var(--accent-hubspot); }
      [data-accent="slack"] { --accent: var(--accent-slack); }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <img class="mesh" src="/src/assets/hero-mesh-1440.webp" alt="" />

      <span class="rule h" style="top: 72px"></span>
      <span class="rule h" style="bottom: 72px"></span>
      <span class="rule v" style="left: 72px"></span>
      <span class="rule v" style="right: 72px"></span>
      <span class="crop tl"></span>
      <span class="crop tr"></span>
      <span class="crop bl"></span>
      <span class="crop br"></span>

      <div class="content">
        <header class="top">
          <div class="wordmark">
            <img src="/src/assets/zensus-logo.png" alt="" />
            <span>Zensus</span>
          </div>
          <span class="host" id="host"></span>
        </header>

        <section class="body">
          <div class="eyebrow" id="category"></div>
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </section>
      </div>
    </div>

    <script>
      // Read query params and populate the template. The generator script
      // navigates to /scripts/og/template.html?title=...&subtitle=...&category=...&accent=...
      const params = new URLSearchParams(window.location.search);
      const title = params.get("title") || "";
      const subtitle = params.get("subtitle") || "";
      const category = params.get("category") || "";
      const accent = params.get("accent") || "green";
      // Domain is passed in from scripts/site.mjs so the card follows
      // SITE_URL rather than pinning the domain into committed PNGs.
      const host = params.get("host");
      if (host) document.getElementById("host").textContent = host;

      const titleEl = document.getElementById("title");
      titleEl.textContent = title;
      document.getElementById("subtitle").textContent = subtitle;

      const eyebrow = document.getElementById("category");
      eyebrow.textContent = category;
      if (!category) eyebrow.setAttribute("data-empty", "true");

      document.getElementById("card").setAttribute("data-accent", accent);

      // Fit the title to two lines, stepping the size down for long titles;
      // past the floor it may take three.
      const fit = () => {
        const lines = (size) => {
          titleEl.style.fontSize = `${size}px`;
          return Math.round(titleEl.getBoundingClientRect().height / (size * 1.02));
        };
        let size = 76;
        while (size > 56 && lines(size) > 2) size -= 2;
        while (size > 46 && lines(size) > 3) size -= 2;
      };
      document.fonts.ready.then(fit);
      fit();
    </script>
  </body>
</html>
